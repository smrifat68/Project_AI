<!DOCTYPE html>
<html>
<head>
    <title>FAQ Chatbot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; background: #f9f9f9; }
        .user-msg { text-align: right; color: blue; }
        .bot-msg { text-align: left; color: green; }
    </style>
</head>
<body class="container mt-5">
    <h2 class="text-center">Support Chatbot</h2>
    <div id="chat-box" class="mb-3 rounded"></div>
    <div class="input-group">
        <input type="text" id="user-input" class="form-control" placeholder="Ask me something...">
        <button id="send-btn" class="btn btn-primary">Send</button>
    </div>

    <script>
        $(document).ready(function() {
            $("#send-btn").click(function() {
                let userText = $("#user-input").val();
                if (userText.trim() === "") return;

                $("#chat-box").append(`<div class="user-msg"><b>You:</b> ${userText}</div>`);
                $("#user-input").val("");

                $.post("/get", { msg: userText }, function(data) {
                    $("#chat-box").append(`<div class="bot-msg"><b>Bot:</b> ${data.response}</div>`);
                    $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                });
            });

            // Allow "Enter" key to send message
            $("#user-input").keypress(function(e) {
                if(e.which == 13) $("#send-btn").click();
            });
        });
    </script>
</body>
</html>
